name: Migrations

# Applique les migrations de `supabase/migrations/` à la base de production quand elles
# arrivent sur `main`. Lancement manuel possible depuis l'onglet Actions.
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

# Jamais deux `db push` en même temps, et jamais d'annulation en cours de route.
concurrency:
  group: migrations
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Lier le projet Supabase
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Migrations en attente
        run: pnpm exec supabase migration list
      - name: Appliquer les migrations
        run: pnpm exec supabase db push
